name: CryptoScope Daily

on:
  workflow_dispatch:
  schedule:
    # UTC: London open +30m, midday, New York open +30m, US afternoon
    - cron: '30 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Validate Python files
        run: python -m compileall -q .
      - name: Run Telegram bot
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOETF_API_KEY: ${{ secrets.CRYPTOETF_API_KEY }}
